# Local development stack for the ImageForge async path.
# Postgres (source of truth), Redis (Streams queue), and MinIO (S3-compatible
# object storage standing in for Cloudflare R2). Start with:
#   docker compose up -d
# Values here are for LOCAL DEVELOPMENT ONLY — never use them in production.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: imageforge
      POSTGRES_PASSWORD: imageforge
      POSTGRES_DB: imageforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imageforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: imageforge
      MINIO_ROOT_PASSWORD: imageforge-dev-secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  miniodata:
