[package]
name = "imageforge-database"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "ImageForge PostgreSQL layer (sqlx): uploads, jobs, transactional outbox."

[dependencies]
imageforge-job-queue = { path = "../job-queue" }
# native-tls uses the OS TLS (SChannel on Windows, OpenSSL on Linux), avoiding
# ring's C-compiler build requirement on the windows-gnu toolchain.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
