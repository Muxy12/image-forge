[package]
name = "imageforge-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "ImageForge image conversion engine — HTTP-independent."

[dependencies]
thiserror.workspace = true
# "avif" enables AVIF *encoding* (ravif/rav1e, pure Rust). AVIF *decoding* would
# need dav1d (a C library) via "avif-native", which we deliberately omit.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "avif"] }
