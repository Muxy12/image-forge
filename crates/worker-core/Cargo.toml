[package]
name = "imageforge-worker-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "ImageForge worker conversion step: ObjectStore in, engine, ObjectStore out."

[dependencies]
imageforge-engine.workspace = true
imageforge-job-queue = { path = "../job-queue" }
imageforge-storage = { path = "../storage" }
bytes = "1"
tokio = { workspace = true, features = ["rt", "macros"] }
thiserror.workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
