# Fly.io config for the ImageForge HTTP API.
# Deploy from the repo root:  fly deploy -c fly.api.toml
# App name must be unique on Fly; change it if "imageforge-api" is taken.
app = "imageforge-api"
primary_region = "cdg"

[build]
  dockerfile = "infra/docker/api.Dockerfile"

[env]
  PORT = "8080"
  RUST_LOG = "imageforge_api=info,tower_http=info"
  # Set to your real frontend origin(s), comma-separated, after the Vercel
  # deploy — e.g. with: fly secrets set CORS_ALLOWED_ORIGINS="https://your-app.vercel.app"
  # (a plain env var is fine too; it is not a secret).

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  method = "GET"
  path = "/health/live"
  interval = "15s"
  timeout = "2s"
  grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
