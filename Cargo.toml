[workspace]
resolver = "2"
members = ["crates/engine", "crates/job-queue", "crates/storage", "crates/database", "services/api"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.98"

[workspace.dependencies]
imageforge-engine = { path = "crates/engine" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = "0.8"
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
